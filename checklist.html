<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 체크리스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-p:#ffffff;--bg-s:#f5f5f4;--bg-t:#efefed;
  --tx-p:#1a1a18;--tx-s:#6b6b68;--tx-t:#a0a09d;
  --bd-l:rgba(0,0,0,0.1);--bd-m:rgba(0,0,0,0.18);--bd-h:rgba(0,0,0,0.28);
  --acc:#185FA5;--acc-d:#0C447C;--r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg-p:#1e1e1c;--bg-s:#2a2a28;--bg-t:#323230;
    --tx-p:#f0f0ee;--tx-s:#a0a09d;--tx-t:#6b6b68;
    --bd-l:rgba(255,255,255,0.08);--bd-m:rgba(255,255,255,0.14);--bd-h:rgba(255,255,255,0.24);
    --acc:#378ADD;--acc-d:#85B7EB;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--tx-p);background:var(--bg-t);min-height:100vh;font-size:14px}
.app{max-width:960px;margin:0 auto;padding:1.25rem 1rem}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding:1rem 1.25rem;background:var(--bg-p);border-radius:var(--rl);border:0.5px solid var(--bd-l)}
.header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.header-right{display:flex;align-items:center;gap:8px}
.settings-btn{padding:5px 11px;border:0.5px solid var(--bd-l);border-radius:var(--r);background:transparent;cursor:pointer;font-size:12px;color:var(--tx-s);font-family:inherit;transition:all .15s}
.settings-btn:hover{background:var(--bg-s);color:var(--tx-p)}
.settings-btn.active{background:var(--bg-s);color:var(--tx-p);border-color:var(--bd-m)}
.tabs{display:flex;gap:3px;background:var(--bg-s);border-radius:var(--r);padding:3px}
.tab{padding:5px 13px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx-s);font-family:inherit;transition:all .15s}
.tab.active{background:var(--bg-p);color:var(--tx-p);font-weight:500;border:0.5px solid var(--bd-l)}

/* settings panel */
.settings-panel{background:var(--bg-p);border:0.5px solid var(--bd-l);border-radius:var(--rl);padding:1.25rem;margin-bottom:1.25rem}
.settings-panel h2{font-size:14px;font-weight:500;margin-bottom:1rem}
.settings-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:560px){.settings-cols{grid-template-columns:1fr}}
.set-sec h3{font-size:11px;font-weight:500;color:var(--tx-s);letter-spacing:.04em;margin-bottom:7px}
.set-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;max-height:200px;overflow-y:auto}
.set-row{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--bg-s);border-radius:var(--r)}
.set-color{width:18px;height:18px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.set-color:hover{transform:scale(1.1)}
.set-name-inp{flex:1;border:none;background:transparent;font-size:12px;font-family:inherit;color:var(--tx-p);outline:none}
.set-del{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:14px;line-height:1;font-family:inherit}
.set-del:hover{color:var(--tx-p)}
.set-add-row{display:flex;gap:5px;align-items:center}
.set-add-inp{flex:1;padding:5px 9px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);outline:none}
.set-add-inp:focus{border-color:var(--bd-h)}
.set-add-btn{padding:5px 11px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500}
.color-palette{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.cp-sw{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s;flex-shrink:0}
.cp-sw:hover{transform:scale(1.2)}
.cp-sw.sel{border-color:var(--tx-p)}

/* nav */
.card{background:var(--bg-p);border-radius:var(--rl);border:0.5px solid var(--bd-l);padding:1.25rem}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.nav-btn{background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:4px 10px;cursor:pointer;font-size:13px;color:var(--tx-p);font-family:inherit}
.nav-title{font-size:14px;font-weight:500;min-width:160px;text-align:center}
.today-btn{font-size:11px;padding:3px 9px;margin-left:auto;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);cursor:pointer;color:var(--tx-s);font-family:inherit}
.today-btn:hover{color:var(--tx-p)}

/* filter bar */
.filter-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:.8rem;min-height:22px}
.fchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;cursor:pointer;border:0.5px solid var(--bd-l);background:transparent;color:var(--tx-s);font-family:inherit;transition:all .15s}
.fchip.active{color:white;border-color:transparent}
.fchip-dot{width:5px;height:5px;border-radius:50%}

/* section */
.section{margin-bottom:1rem}
.sec-hdr{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sdot{width:7px;height:7px;border-radius:50%}
.sdot-u{background:#E24B4A}.sdot-l{background:#888780}
.stitle{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--tx-s)}
.scnt{font-size:11px;color:var(--tx-t)}
.sec-div{height:0.5px;background:var(--bd-l);margin:1rem 0}

/* drop zone */
.drop-zone{min-height:44px;border-radius:var(--r);border:1.5px dashed transparent;transition:all .15s;padding:2px}
.drop-zone.drag-over{border-color:var(--bd-m);background:var(--bg-s)}
.drop-zone.empty{border-color:var(--bd-l)}

/* task */
.task-item{background:var(--bg-p);border:0.5px solid var(--bd-l);border-radius:var(--r);margin-bottom:4px;overflow:hidden;transition:border-color .15s,opacity .15s}
.task-item:hover{border-color:var(--bd-m)}
.task-item.expanded{border-color:var(--bd-h)}
.task-item.dragging{opacity:.35}
.task-item.drag-ph{border:1.5px dashed var(--bd-m);background:var(--bg-s);height:38px;pointer-events:none}
.task-main{display:flex;align-items:center;gap:7px;padding:8px 11px;cursor:pointer;user-select:none}
.dh{cursor:grab;color:var(--tx-t);font-size:12px;flex-shrink:0}
.dh:active{cursor:grabbing}
.task-cb{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--bd-m);cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;background:transparent;position:relative;transition:all .15s}
.task-cb:checked{background:var(--acc);border-color:var(--acc)}
.task-cb:checked::after{content:'';position:absolute;left:2px;top:0px;width:4px;height:6px;border:1.5px solid white;border-top:none;border-left:none;transform:rotate(45deg)}
.twrap{flex:1;min-width:0}
.ttitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ttitle.done{text-decoration:line-through;color:var(--tx-t)}
.tmeta{display:flex;align-items:center;gap:4px;margin-top:2px;flex-wrap:wrap}
.itag{display:inline-flex;align-items:center;padding:1px 5px;border-radius:20px;font-size:10px;font-weight:500;color:white;flex-shrink:0}
.av-xs{width:13px;height:13px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:6px;font-weight:500;color:white;flex-shrink:0}
.sub-prog{font-size:10px;color:var(--tx-t)}
.memo-prev{font-size:10px;color:var(--tx-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tact{display:flex;align-items:center;gap:4px;flex-shrink:0}
.exp-icon{font-size:9px;color:var(--tx-t);transition:transform .2s}
.exp-icon.open{transform:rotate(180deg)}
.tdel{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:14px;padding:0;line-height:1;font-family:inherit}
.tdel:hover{color:var(--tx-p)}

/* detail */
.task-detail{display:none;padding:0 11px 11px;border-top:0.5px solid var(--bd-l)}
.task-detail.open{display:block}
.dlabel{font-size:11px;font-weight:500;color:var(--tx-s);margin:8px 0 5px;letter-spacing:.04em}

/* subtasks */
.subtask-list{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.subtask-row{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--bg-s);border-radius:var(--r);border:0.5px solid transparent;transition:border-color .15s}
.subtask-row:hover{border-color:var(--bd-l)}
.sub-cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--bd-m);cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;background:transparent;position:relative;transition:all .15s}
.sub-cb:checked{background:var(--acc);border-color:var(--acc)}
.sub-cb:checked::after{content:'';position:absolute;left:2px;top:0px;width:3px;height:5px;border:1.5px solid white;border-top:none;border-left:none;transform:rotate(45deg)}
.sub-title{flex:1;font-size:12px}
.sub-title.done{text-decoration:line-through;color:var(--tx-t)}
.sub-del{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:13px;padding:0;line-height:1;font-family:inherit}
.sub-del:hover{color:var(--tx-p)}
.sub-prog-bar{height:3px;background:var(--bd-l);border-radius:2px;margin-bottom:6px;overflow:hidden}
.sub-prog-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.sub-add-row{display:flex;gap:5px}
.sub-add-inp{flex:1;padding:5px 8px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);outline:none}
.sub-add-inp:focus{border-color:var(--bd-h)}
.sub-add-btn{padding:5px 10px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500}

/* assignee */
.assignee-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.av-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:white;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:border-color .15s;position:relative}
.av-sm.selected{border-color:var(--tx-p)}
.av-tip{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:var(--tx-p);color:var(--bg-p);font-size:9px;padding:1px 5px;border-radius:3px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}
.av-sm:hover .av-tip{opacity:1}

/* tag editor */
.tag-editor{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;color:white}
.tbadge-rm{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.75);font-size:12px;line-height:1;padding:0;font-family:inherit}
.tag-add-wrap{position:relative}
.tag-add-btn{padding:2px 8px;border-radius:20px;font-size:11px;border:0.5px dashed var(--bd-m);background:transparent;color:var(--tx-s);cursor:pointer;font-family:inherit}
.tag-dd{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg-p);border:0.5px solid var(--bd-m);border-radius:var(--r);padding:6px;z-index:300;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tag-dd-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12px}
.tag-dd-item:hover{background:var(--bg-s)}
.tdd-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* memo */
.memo-ta{width:100%;min-height:60px;padding:6px 8px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);resize:vertical;outline:none;line-height:1.5}
.memo-ta:focus{border-color:var(--bd-h);background:var(--bg-p)}

/* urls */
.url-list{display:flex;flex-direction:column;gap:3px;margin-bottom:5px}
.url-row{display:flex;align-items:center;gap:5px;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:4px 8px}
.url-link{font-size:11px;color:var(--acc);text-decoration:none;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url-link:hover{text-decoration:underline}
.url-label{font-size:10px;color:var(--tx-s);flex-shrink:0;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url-sep{font-size:10px;color:var(--tx-t);flex-shrink:0}
.url-del{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:13px;line-height:1;padding:0;font-family:inherit;flex-shrink:0}
.url-del:hover{color:var(--tx-p)}
.url-add-form{display:none;flex-direction:column;gap:4px;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:7px 9px}
.url-add-form.open{display:flex}
.url-inp{padding:4px 7px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg-p);color:var(--tx-p);outline:none}
.url-inp:focus{border-color:var(--bd-h)}
.url-form-row{display:flex;gap:4px}
.url-save-btn{padding:3px 10px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500}
.url-save-btn:hover{background:var(--acc-d)}
.url-cancel-btn{padding:3px 8px;background:transparent;color:var(--tx-s);border:0.5px solid var(--bd-l);border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit}
.url-add-trigger{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--r);font-size:11px;border:0.5px dashed var(--bd-m);background:transparent;color:var(--tx-s);cursor:pointer;font-family:inherit}
.url-add-trigger:hover{color:var(--tx-p)}

/* save row */
.save-row{display:flex;justify-content:flex-end;gap:5px;margin-top:5px;align-items:center}
.save-btn{padding:4px 12px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500}
.save-btn:hover{background:var(--acc-d)}
.saved-badge{font-size:10px;color:#1D9E75;opacity:0;transition:opacity .3s}
.saved-badge.show{opacity:1}

/* add row */
.add-row{display:flex;gap:5px;margin-top:4px}
.add-inp{flex:1;padding:6px 10px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:13px;background:var(--bg-s);color:var(--tx-p);font-family:inherit;outline:none}
.add-inp:focus{border-color:var(--bd-h)}
.add-btn{padding:6px 12px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500}
.add-btn:hover{background:var(--acc-d)}
.empty-sec{font-size:12px;color:var(--tx-t);padding:10px 4px 6px}

/* board */
.board-toolbar{display:flex;align-items:center;margin-bottom:1rem}
.board-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.board-col{min-width:210px;max-width:225px;flex-shrink:0;background:var(--bg-s);border-radius:var(--rl);padding:10px}
.board-col-hdr{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.board-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:white;flex-shrink:0}
.board-name{font-size:12px;font-weight:500}
.board-cnt{font-size:11px;color:var(--tx-t);margin-left:auto}
.board-card{background:var(--bg-p);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:8px 10px;margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.board-card:hover{border-color:var(--bd-m)}
.board-card-title{font-size:12px;margin-bottom:4px;line-height:1.35}
.board-card-title.done{text-decoration:line-through;color:var(--tx-t)}
.board-card-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.board-date{font-size:10px;color:var(--tx-t)}

/* cal */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd-l);border:0.5px solid var(--bd-l);border-radius:var(--rl);overflow:hidden}
.cal-head{background:var(--bg-s);padding:6px;text-align:center;font-size:11px;font-weight:500;color:var(--tx-s)}
.cal-cell{background:var(--bg-p);min-height:80px;padding:5px;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:var(--bg-s)}
.cal-cell.other-m{background:var(--bg-s)}
.cal-cell.other-m .cal-dn{color:var(--tx-t)}
.cal-cell.is-today .cal-dn{background:var(--acc);color:white;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.cal-cell.sel-day{outline:2px solid var(--acc);outline-offset:-2px}
.cal-dn{font-size:11px;font-weight:500;margin-bottom:3px;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.cal-pill{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-pill.u{background:#FCEBEB;color:#A32D2D}
.cal-pill.l{background:#F1EFE8;color:#5F5E5A}
.cal-pill.done{background:var(--bg-s);color:var(--tx-t);text-decoration:line-through}
.cal-more{font-size:9px;color:var(--acc);font-weight:500;margin-top:1px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>업무 체크리스트</h1>
    <div class="header-right">
      <button class="settings-btn" id="settings-toggle" onclick="toggleSettings()">⚙ 설정</button>
      <div class="tabs">
        <button class="tab active" onclick="switchView('list')">리스트</button>
        <button class="tab" onclick="switchView('calendar')">달력</button>
        <button class="tab" onclick="switchView('board')">보드</button>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settings-panel" style="display:none">
    <h2>설정</h2>
    <div class="settings-cols">
      <div class="set-sec">
        <h3>담당자</h3>
        <div class="set-list" id="member-set-list"></div>
        <div class="set-add-row">
          <input class="set-add-inp" id="member-add-inp" placeholder="이름 입력..." onkeydown="if(event.key==='Enter')addMember()">
          <button class="set-add-btn" onclick="addMember()">추가</button>
        </div>
      </div>
      <div class="set-sec">
        <h3>태그</h3>
        <div class="color-palette" id="tag-palette"></div>
        <div class="set-list" id="tag-set-list"></div>
        <div class="set-add-row">
          <input class="set-add-inp" id="tag-add-inp" placeholder="태그 이름..." onkeydown="if(event.key==='Enter')addTag()">
          <button class="set-add-btn" onclick="addTag()">추가</button>
        </div>
      </div>
    </div>
  </div>

  <!-- List View -->
  <div class="card" id="list-view">
    <div class="nav">
      <button class="nav-btn" onclick="changeDate(-1)">◀</button>
      <div class="nav-title" id="date-label"></div>
      <button class="nav-btn" onclick="changeDate(1)">▶</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="list-container"></div>
  </div>

  <!-- Calendar View -->
  <div class="card" id="calendar-view" style="display:none">
    <div class="nav">
      <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="nav-title" id="month-label"></div>
      <button class="nav-btn" onclick="changeMonth(1)">▶</button>
      <button class="today-btn" onclick="goTodayCal()">오늘</button>
    </div>
    <div id="cal-container"></div>
  </div>

  <!-- Board View -->
  <div class="card" id="board-view" style="display:none">
    <div class="board-toolbar">
      <span style="font-size:12px;color:var(--tx-s)">담당자별 전체 업무</span>
    </div>
    <div class="board-scroll" id="board-container"></div>
  </div>
</div>

<script>
const DAYS=['일','월','화','수','목','금','토'];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const COLORS=['#185FA5','#1D9E75','#E24B4A','#BA7517','#7F77DD','#D4537E','#639922','#0F6E56','#888780','#D85A30'];
const AV_COLORS=['#185FA5','#1D9E75','#7F77DD','#D4537E','#BA7517','#E24B4A','#0F6E56','#639922'];

let tasks={},tags={},members={};
let selDate=new Date(),calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
let expandedId=null,tagFilter=null,urlFormId=null,openDDId=null;
let newTagColor=COLORS[0],settingsOpen=false;
let dragSrc=null,dragEl=null,ph=null;

function uid(){return Math.random().toString(36).slice(2,9)}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayDk(){return dk(new Date())}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'}
function memberColor(mid){return members[mid]&&members[mid].color?members[mid].color:AV_COLORS[Object.keys(members).indexOf(mid)%AV_COLORS.length]}
function ensureDay(k){if(!tasks[k])tasks[k]={urgent:[],later:[]};if(!tasks[k].urgent)tasks[k].urgent=[];if(!tasks[k].later)tasks[k].later=[];}
function allTasks(){const a=[];Object.entries(tasks).forEach(([k,d])=>{[...(d.urgent||[]),...(d.later||[])].forEach(t=>a.push({...t,dateKey:k}));});return a;}

function load(){
  try{const s=localStorage.getItem('wc_v7');if(s){const d=JSON.parse(s);tasks=d.tasks||{};tags=d.tags||{};members=d.members||{};}}catch(e){}
  migrate();seed();
}
function migrate(){
  Object.keys(tasks).forEach(k=>{
    if(Array.isArray(tasks[k]))tasks[k]={urgent:tasks[k],later:[]};
    [...(tasks[k].urgent||[]),...(tasks[k].later||[])].forEach(t=>{
      if(!t.tags)t.tags=[];if(!t.urls)t.urls=[];if(!t.assignees)t.assignees=[];if(!t.subtasks)t.subtasks=[];
    });
  });
}
function seed(){
  if(!Object.keys(tags).length) tags={'tg1':{name:'개발',color:'#185FA5'},'tg2':{name:'미팅',color:'#7F77DD'},'tg3':{name:'문서',color:'#1D9E75'},'tg4':{name:'마케팅',color:'#D4537E'}};
  if(!Object.keys(members).length) members={'m1':{name:'김철수',color:'#185FA5'},'m2':{name:'이영희',color:'#1D9E75'},'m3':{name:'박지수',color:'#7F77DD'}};
  const t=new Date();
  [[0,[
    {text:'주간 보고서 작성',done:false,memo:'KPI 정리 필요',cat:'urgent',tags:['tg3'],assignees:['m1'],urls:[{id:'u1',label:'템플릿',href:'https://docs.google.com'}],subtasks:[{id:'s1',text:'매출 현황 정리',done:true},{id:'s2',text:'팀 진행 상황 작성',done:false},{id:'s3',text:'최종 검토',done:false}]},
    {text:'팀 미팅 준비',done:false,memo:'',cat:'urgent',tags:['tg2'],assignees:['m1','m2'],urls:[],subtasks:[{id:'s4',text:'아젠다 작성',done:false},{id:'s5',text:'자료 공유',done:false}]},
    {text:'이메일 답장',done:true,memo:'',cat:'later',tags:[],assignees:['m2'],urls:[],subtasks:[]},
  ]],[-1,[
    {text:'월간 리뷰',done:true,memo:'완료',cat:'urgent',tags:['tg3'],assignees:['m3'],urls:[],subtasks:[{id:'s6',text:'데이터 수집',done:true},{id:'s7',text:'리포트 작성',done:true}]},
  ]]].forEach(([o,items])=>{
    const d=new Date(t);d.setDate(t.getDate()+o);const k=dk(d);
    if(!tasks[k]){tasks[k]={urgent:[],later:[]};items.forEach(item=>tasks[k][item.cat].push({id:uid(),text:item.text,done:item.done,memo:item.memo||'',tags:item.tags||[],assignees:item.assignees||[],urls:item.urls||[],subtasks:item.subtasks||[]}));}
  });
  save();
}
function save(){try{localStorage.setItem('wc_v7',JSON.stringify({tasks,tags,members}));}catch(e){}}

function switchView(v){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['list','calendar','board'].indexOf(v)===i));
  ['list-view','calendar-view','board-view'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById(v+'-view').style.display='block';
  if(v==='calendar')renderCal();if(v==='board')renderBoard();
}
function changeDate(d){selDate=new Date(selDate);selDate.setDate(selDate.getDate()+d);expandedId=null;tagFilter=null;render();}
function goToday(){selDate=new Date();expandedId=null;tagFilter=null;render();}
function changeMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCal();}
function goTodayCal(){const t=new Date();calMonth=t.getMonth();calYear=t.getFullYear();renderCal();}

// ── Settings ──
function toggleSettings(){
  settingsOpen=!settingsOpen;
  document.getElementById('settings-panel').style.display=settingsOpen?'block':'none';
  document.getElementById('settings-toggle').classList.toggle('active',settingsOpen);
  if(settingsOpen)renderSettings();
}
function renderSettings(){renderMemberSettings();renderTagSettings();}

function renderMemberSettings(){
  const list=document.getElementById('member-set-list');list.innerHTML='';
  Object.entries(members).forEach(([mid,m])=>{
    const row=document.createElement('div');row.className='set-row';
    const clr=document.createElement('div');clr.className='set-color';clr.style.background=m.color||'#888';clr.title='클릭해서 색상 변경';
    clr.onclick=()=>{const idx=AV_COLORS.indexOf(m.color);m.color=AV_COLORS[(idx+1)%AV_COLORS.length];clr.style.background=m.color;save();render();};
    const inp=document.createElement('input');inp.className='set-name-inp';inp.value=m.name;
    inp.onchange=()=>{if(inp.value.trim()){members[mid].name=inp.value.trim();save();render();}};
    const del=document.createElement('button');del.className='set-del';del.textContent='×';
    del.onclick=()=>{delete members[mid];save();renderMemberSettings();render();};
    row.appendChild(clr);row.appendChild(inp);row.appendChild(del);list.appendChild(row);
  });
}
function addMember(){
  const inp=document.getElementById('member-add-inp');const v=inp.value.trim();if(!v)return;
  members['m'+uid()]={name:v,color:AV_COLORS[Object.keys(members).length%AV_COLORS.length]};
  inp.value='';save();renderMemberSettings();render();
}

function renderTagSettings(){
  const palette=document.getElementById('tag-palette');palette.innerHTML='';
  COLORS.forEach(c=>{
    const sw=document.createElement('div');sw.className='cp-sw'+(c===newTagColor?' sel':'');sw.style.background=c;
    sw.onclick=()=>{newTagColor=c;palette.querySelectorAll('.cp-sw').forEach(s=>s.classList.toggle('sel',s.style.background===c));};
    palette.appendChild(sw);
  });
  const list=document.getElementById('tag-set-list');list.innerHTML='';
  Object.entries(tags).forEach(([tid,tag])=>{
    const row=document.createElement('div');row.className='set-row';
    const clr=document.createElement('div');clr.className='set-color';clr.style.background=tag.color;clr.title='클릭해서 색상 변경';
    clr.onclick=()=>{const idx=COLORS.indexOf(tag.color);tag.color=COLORS[(idx+1)%COLORS.length];clr.style.background=tag.color;save();render();};
    const inp=document.createElement('input');inp.className='set-name-inp';inp.value=tag.name;
    inp.onchange=()=>{if(inp.value.trim()){tags[tid].name=inp.value.trim();save();render();}};
    const del=document.createElement('button');del.className='set-del';del.textContent='×';
    del.onclick=()=>{delete tags[tid];save();renderTagSettings();render();};
    row.appendChild(clr);row.appendChild(inp);row.appendChild(del);list.appendChild(row);
  });
}
function addTag(){
  const inp=document.getElementById('tag-add-inp');const v=inp.value.trim();if(!v)return;
  tags['tg'+uid()]={name:v,color:newTagColor};
  inp.value='';save();renderTagSettings();render();
}

// ── Drag & Drop ──
function onDS(e,k,cat,idx){dragSrc={k,cat,idx};dragEl=e.currentTarget.closest('.task-item');dragEl.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');ph=document.createElement('div');ph.className='task-item drag-ph';}
function onDE(){if(dragEl)dragEl.classList.remove('dragging');if(ph&&ph.parentNode)ph.parentNode.removeChild(ph);document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drag-over'));dragSrc=null;dragEl=null;ph=null;}
function onDO(e,zone,k,cat){if(!dragSrc)return;e.preventDefault();zone.classList.add('drag-over');const items=[...zone.querySelectorAll('.task-item:not(.drag-ph)')];let ins=false;for(const it of items){const r=it.getBoundingClientRect();if(e.clientY<r.top+r.height/2){zone.insertBefore(ph,it);ins=true;break;}}if(!ins)zone.appendChild(ph);}
function onDL(e,zone){if(!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');}
function onDrop(e,k,cat){e.preventDefault();if(!dragSrc)return;e.currentTarget.classList.remove('drag-over');ensureDay(k);const dest=tasks[k][cat];const items=[...e.currentTarget.querySelectorAll('.task-item:not(.drag-ph)')];let di=items.indexOf(ph);if(di===-1)di=items.length;const src=tasks[dragSrc.k][dragSrc.cat];const[mv]=src.splice(dragSrc.idx,1);if(dragSrc.k===k&&dragSrc.cat===cat&&dragSrc.idx<di)di--;dest.splice(di,0,mv);save();render();}

// ── Tag Dropdown ──
function closeDD(){openDDId=null;document.querySelectorAll('.tag-dd').forEach(d=>d.remove());}
function openTagDD(taskId,anchor,t){
  closeDD();openDDId=taskId;
  const dd=document.createElement('div');dd.className='tag-dd';dd.onclick=e=>e.stopPropagation();
  if(!Object.keys(tags).length){const em=document.createElement('div');em.style.cssText='font-size:11px;color:var(--tx-t);padding:4px 6px';em.textContent='설정에서 태그를 추가하세요';dd.appendChild(em);}
  Object.entries(tags).forEach(([tid,tag])=>{
    const already=(t.tags||[]).includes(tid);
    const item=document.createElement('div');item.className='tag-dd-item';
    item.innerHTML='<span class="tdd-dot" style="background:'+tag.color+'"></span><span style="flex:1">'+tag.name+'</span>'+(already?'<span style="font-size:10px;color:var(--tx-t)">✓</span>':'');
    item.onclick=()=>{if(!t.tags)t.tags=[];t.tags=already?t.tags.filter(x=>x!==tid):[...t.tags,tid];save();closeDD();render();};
    dd.appendChild(item);
  });
  anchor.style.position='relative';anchor.appendChild(dd);
}

// ── Filter bar ──
function getUsedTags(){const k=dk(selDate);ensureDay(k);const used=new Set();[...tasks[k].urgent,...tasks[k].later].forEach(t=>(t.tags||[]).forEach(tid=>used.add(tid)));return[...used];}
function renderFilterBar(){
  const bar=document.getElementById('filter-bar');bar.innerHTML='';
  const used=getUsedTags();if(!used.length)return;
  const all=document.createElement('button');all.className='fchip'+(tagFilter===null?' active':'');all.textContent='전체';if(tagFilter===null)all.style.background='var(--acc)';all.onclick=()=>{tagFilter=null;render();};bar.appendChild(all);
  used.forEach(tid=>{const tag=tags[tid];if(!tag)return;const chip=document.createElement('button');chip.className='fchip'+(tagFilter===tid?' active':'');if(tagFilter===tid)chip.style.background=tag.color;chip.innerHTML='<span class="fchip-dot" style="background:'+tag.color+'"></span>'+tag.name;chip.onclick=()=>{tagFilter=tagFilter===tid?null:tid;render();};bar.appendChild(chip);});
}

// ── Render ──
function render(){
  closeDD();renderFilterBar();
  const k=dk(selDate);const isToday=k===todayDk();ensureDay(k);
  document.getElementById('date-label').textContent=selDate.getMonth()+1+'월 '+selDate.getDate()+'일 ('+DAYS[selDate.getDay()]+')'+( isToday?' — 오늘':'');
  const container=document.getElementById('list-container');container.innerHTML='';
  ['urgent','later'].forEach((cat,si)=>{
    const raw=tasks[k][cat];const list=tagFilter?raw.filter(t=>(t.tags||[]).includes(tagFilter)):raw;
    const done=list.filter(t=>t.done).length;
    const sec=document.createElement('div');sec.className='section';
    const sh=document.createElement('div');sh.className='sec-hdr';
    const dot=document.createElement('span');dot.className='sdot '+(cat==='urgent'?'sdot-u':'sdot-l');
    const st=document.createElement('span');st.className='stitle';st.textContent=cat==='urgent'?'오늘 꼭 할 일':'다음에 할 일';
    const cnt=document.createElement('span');cnt.className='scnt';cnt.textContent=list.length?done+'/'+list.length:'';
    sh.appendChild(dot);sh.appendChild(st);sh.appendChild(cnt);sec.appendChild(sh);
    const zone=document.createElement('div');zone.className='drop-zone'+(list.length===0?' empty':'');
    zone.addEventListener('dragover',e=>onDO(e,zone,k,cat));zone.addEventListener('dragleave',e=>onDL(e,zone));zone.addEventListener('drop',e=>onDrop(e,k,cat));
    list.forEach(t=>zone.appendChild(buildTask(t,k,cat,raw.indexOf(t))));
    if(!list.length){const em=document.createElement('div');em.className='empty-sec';em.textContent=tagFilter?'해당 태그 업무 없음':(cat==='urgent'?'긴급 업무가 없습니다.':'나중에 할 업무가 없습니다.');zone.appendChild(em);}
    sec.appendChild(zone);
    if(!tagFilter){const ar=document.createElement('div');ar.className='add-row';const inp=document.createElement('input');inp.className='add-inp';inp.type='text';inp.placeholder=cat==='urgent'?'오늘 꼭 할 일 추가...':'나중에 할 일 추가...';const btn=document.createElement('button');btn.className='add-btn';btn.textContent='추가';const add=()=>{const v=inp.value.trim();if(!v)return;tasks[k][cat].push({id:uid(),text:v,done:false,memo:'',tags:[],assignees:[],urls:[],subtasks:[]});inp.value='';save();render();};btn.onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add();};ar.appendChild(inp);ar.appendChild(btn);sec.appendChild(ar);}
    container.appendChild(sec);
    if(si===0){const dv=document.createElement('div');dv.className='sec-div';container.appendChild(dv);}
  });
}

function buildTask(t,k,cat,idx){
  const isExp=expandedId===t.id;
  const subDone=(t.subtasks||[]).filter(s=>s.done).length,subTotal=(t.subtasks||[]).length;
  const item=document.createElement('div');item.className='task-item'+(isExp?' expanded':'');item.draggable=true;
  item.addEventListener('dragstart',e=>onDS(e,k,cat,idx));item.addEventListener('dragend',onDE);
  const main=document.createElement('div');main.className='task-main';
  const dh=document.createElement('span');dh.className='dh';dh.textContent='⠿';dh.addEventListener('mousedown',e=>e.stopPropagation());
  const cb=document.createElement('input');cb.type='checkbox';cb.className='task-cb';cb.checked=t.done;cb.onclick=e=>{e.stopPropagation();t.done=cb.checked;save();render();};
  const tw=document.createElement('div');tw.className='twrap';
  const tt=document.createElement('div');tt.className='ttitle'+(t.done?' done':'');tt.textContent=t.text;tw.appendChild(tt);
  const hasMeta=(t.tags||[]).length||(t.assignees||[]).length||(subTotal>0&&!isExp)||(t.memo&&!isExp);
  if(hasMeta){
    const meta=document.createElement('div');meta.className='tmeta';
    (t.tags||[]).forEach(tid=>{const tag=tags[tid];if(!tag)return;const b=document.createElement('span');b.className='itag';b.style.background=tag.color;b.textContent=tag.name;meta.appendChild(b);});
    (t.assignees||[]).forEach(mid=>{const m=members[mid];if(!m)return;const av=document.createElement('div');av.className='av-xs';av.style.background=memberColor(mid);av.textContent=initials(m.name);av.title=m.name;meta.appendChild(av);});
    if(subTotal>0&&!isExp){const sp=document.createElement('span');sp.className='sub-prog';sp.textContent=subDone+'/'+subTotal;meta.appendChild(sp);}
    if(t.memo&&!isExp){const mp=document.createElement('span');mp.className='memo-prev';mp.textContent=t.memo.split('\n')[0];meta.appendChild(mp);}
    tw.appendChild(meta);
  }
  const act=document.createElement('div');act.className='tact';
  const ei=document.createElement('span');ei.className='exp-icon'+(isExp?' open':'');ei.textContent='▼';
  const del=document.createElement('button');del.className='tdel';del.textContent='×';del.onclick=e=>{e.stopPropagation();tasks[k][cat].splice(idx,1);if(expandedId===t.id)expandedId=null;save();render();};
  act.appendChild(ei);act.appendChild(del);
  main.appendChild(dh);main.appendChild(cb);main.appendChild(tw);main.appendChild(act);
  main.onclick=()=>{expandedId=isExp?null:t.id;render();};
  const det=document.createElement('div');det.className='task-detail'+(isExp?' open':'');

  // subtasks
  const sl=document.createElement('div');sl.className='dlabel';sl.textContent='하위 태스크';det.appendChild(sl);
  if(subTotal>0){const pb=document.createElement('div');pb.className='sub-prog-bar';const pf=document.createElement('div');pf.className='sub-prog-fill';pf.style.width=Math.round(subDone/subTotal*100)+'%';pb.appendChild(pf);det.appendChild(pb);}
  const stList=document.createElement('div');stList.className='subtask-list';
  (t.subtasks||[]).forEach((s,si2)=>{
    const row=document.createElement('div');row.className='subtask-row';
    const scb=document.createElement('input');scb.type='checkbox';scb.className='sub-cb';scb.checked=s.done;scb.onclick=e=>{e.stopPropagation();s.done=scb.checked;save();render();};
    const stxt=document.createElement('span');stxt.className='sub-title'+(s.done?' done':'');stxt.textContent=s.text;
    const sdel=document.createElement('button');sdel.className='sub-del';sdel.textContent='×';sdel.onclick=e=>{e.stopPropagation();t.subtasks.splice(si2,1);save();render();};
    row.appendChild(scb);row.appendChild(stxt);row.appendChild(sdel);stList.appendChild(row);
  });
  det.appendChild(stList);
  const sar=document.createElement('div');sar.className='sub-add-row';
  const sinp=document.createElement('input');sinp.className='sub-add-inp';sinp.placeholder='하위 태스크 추가...';
  const sadd=document.createElement('button');sadd.className='sub-add-btn';sadd.textContent='추가';
  const addSub=()=>{const v=sinp.value.trim();if(!v)return;if(!t.subtasks)t.subtasks=[];t.subtasks.push({id:'s'+uid(),text:v,done:false});sinp.value='';save();render();};
  sadd.onclick=e=>{e.stopPropagation();addSub();};sinp.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();addSub();}};sinp.onclick=e=>e.stopPropagation();
  sar.appendChild(sinp);sar.appendChild(sadd);det.appendChild(sar);

  // assignees
  const al=document.createElement('div');al.className='dlabel';al.textContent='담당자';det.appendChild(al);
  const ar=document.createElement('div');ar.className='assignee-row';
  if(!Object.keys(members).length){const nm=document.createElement('span');nm.style.cssText='font-size:11px;color:var(--tx-t)';nm.textContent='설정에서 담당자를 추가하세요';ar.appendChild(nm);}
  Object.entries(members).forEach(([mid,m])=>{
    const av=document.createElement('div');av.className='av-sm'+((t.assignees||[]).includes(mid)?' selected':'');av.style.background=memberColor(mid);av.textContent=initials(m.name);
    const tip=document.createElement('span');tip.className='av-tip';tip.textContent=m.name;av.appendChild(tip);
    av.onclick=e=>{e.stopPropagation();if(!t.assignees)t.assignees=[];const has=t.assignees.includes(mid);t.assignees=has?t.assignees.filter(x=>x!==mid):[...t.assignees,mid];save();render();};
    ar.appendChild(av);
  });
  det.appendChild(ar);

  // tags
  const tl=document.createElement('div');tl.className='dlabel';tl.textContent='태그';det.appendChild(tl);
  const te=document.createElement('div');te.className='tag-editor';
  (t.tags||[]).forEach(tid=>{const tag=tags[tid];if(!tag)return;const b=document.createElement('span');b.className='tbadge';b.style.background=tag.color;const nm=document.createElement('span');nm.textContent=tag.name;const rm=document.createElement('button');rm.className='tbadge-rm';rm.textContent='×';rm.onclick=e=>{e.stopPropagation();t.tags=t.tags.filter(x=>x!==tid);save();render();};b.appendChild(nm);b.appendChild(rm);te.appendChild(b);});
  const taw=document.createElement('div');taw.className='tag-add-wrap';const tab2=document.createElement('button');tab2.className='tag-add-btn';tab2.textContent='+ 태그';tab2.onclick=e=>{e.stopPropagation();openTagDD(t.id,taw,t);};taw.appendChild(tab2);te.appendChild(taw);det.appendChild(te);

  // memo
  const ml=document.createElement('div');ml.className='dlabel';ml.textContent='메모';
  const ta=document.createElement('textarea');ta.className='memo-ta';ta.placeholder='메모를 입력하세요...';ta.value=t.memo||'';ta.onclick=e=>e.stopPropagation();
  det.appendChild(ml);det.appendChild(ta);

  // urls
  const ul=document.createElement('div');ul.className='dlabel';ul.textContent='관련 링크';det.appendChild(ul);
  const urlList=document.createElement('div');urlList.className='url-list';
  (t.urls||[]).forEach(u=>{
    const row=document.createElement('div');row.className='url-row';
    const lbl=document.createElement('span');lbl.className='url-label';lbl.textContent=u.label||'링크';lbl.title=u.label;
    const sep=document.createElement('span');sep.className='url-sep';sep.textContent='·';
    const a=document.createElement('a');a.className='url-link';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=u.href;a.title=u.href;a.onclick=e=>e.stopPropagation();
    const dm=document.createElement('button');dm.className='url-del';dm.textContent='×';dm.onclick=e=>{e.stopPropagation();t.urls=t.urls.filter(x=>x.id!==u.id);save();render();};
    row.appendChild(lbl);row.appendChild(sep);row.appendChild(a);row.appendChild(dm);urlList.appendChild(row);
  });
  det.appendChild(urlList);
  const uf=document.createElement('div');uf.className='url-add-form'+(urlFormId===t.id?' open':'');uf.onclick=e=>e.stopPropagation();
  const uH=document.createElement('input');uH.className='url-inp';uH.placeholder='https://...';uH.type='url';
  const uL=document.createElement('input');uL.className='url-inp';uL.placeholder='표시 이름 (선택)';
  const ufr=document.createElement('div');ufr.className='url-form-row';
  const usv=document.createElement('button');usv.className='url-save-btn';usv.textContent='저장';usv.onclick=e=>{e.stopPropagation();const href=uH.value.trim();if(!href)return;if(!t.urls)t.urls=[];t.urls.push({id:'u'+uid(),label:uL.value.trim()||href,href});urlFormId=null;save();render();};
  const ucn=document.createElement('button');ucn.className='url-cancel-btn';ucn.textContent='취소';ucn.onclick=e=>{e.stopPropagation();urlFormId=null;render();};
  ufr.appendChild(usv);ufr.appendChild(ucn);uf.appendChild(uH);uf.appendChild(uL);uf.appendChild(ufr);det.appendChild(uf);
  const uadd=document.createElement('button');uadd.className='url-add-trigger';uadd.textContent='+ URL';uadd.style.display=urlFormId===t.id?'none':'inline-flex';uadd.onclick=e=>{e.stopPropagation();urlFormId=t.id;render();};det.appendChild(uadd);

  // memo save
  const sr=document.createElement('div');sr.className='save-row';const sb=document.createElement('span');sb.className='saved-badge';sb.textContent='저장됨';const ssb=document.createElement('button');ssb.className='save-btn';ssb.textContent='메모 저장';ssb.onclick=e=>{e.stopPropagation();t.memo=ta.value;save();sb.classList.add('show');setTimeout(()=>sb.classList.remove('show'),1400);render();};sr.appendChild(sb);sr.appendChild(ssb);det.appendChild(sr);
  item.appendChild(main);item.appendChild(det);return item;
}

function renderBoard(){
  const container=document.getElementById('board-container');container.innerHTML='';
  const all=allTasks();const cols={};Object.keys(members).forEach(mid=>cols[mid]=[]);cols['__none__']=[];
  all.forEach(t=>{if(!(t.assignees||[]).length)cols['__none__'].push(t);else(t.assignees||[]).forEach(mid=>{if(cols[mid])cols[mid].push(t);});});
  [...Object.keys(members),'__none__'].forEach(mid=>{
    const items=cols[mid];if(mid==='__none__'&&!items.length)return;
    const col=document.createElement('div');col.className='board-col';
    const hdr=document.createElement('div');hdr.className='board-col-hdr';
    if(mid!=='__none__'){const av=document.createElement('div');av.className='board-av';av.style.background=memberColor(mid);av.textContent=initials(members[mid].name);const nm=document.createElement('div');nm.className='board-name';nm.textContent=members[mid].name;const cnt=document.createElement('div');cnt.className='board-cnt';cnt.textContent=items.length+'개';hdr.appendChild(av);hdr.appendChild(nm);hdr.appendChild(cnt);}
    else{const nm=document.createElement('div');nm.className='board-name';nm.style.color='var(--tx-t)';nm.textContent='미할당';const cnt=document.createElement('div');cnt.className='board-cnt';cnt.textContent=items.length+'개';hdr.appendChild(nm);hdr.appendChild(cnt);}
    col.appendChild(hdr);
    items.forEach(t=>{
      const subDone=(t.subtasks||[]).filter(s=>s.done).length,subTotal=(t.subtasks||[]).length;
      const card=document.createElement('div');card.className='board-card';
      const tt2=document.createElement('div');tt2.className='board-card-title'+(t.done?' done':'');tt2.textContent=t.text;
      const meta=document.createElement('div');meta.className='board-card-meta';
      (t.tags||[]).forEach(tid=>{const tag=tags[tid];if(!tag)return;const b=document.createElement('span');b.className='itag';b.style.background=tag.color;b.textContent=tag.name;meta.appendChild(b);});
      if(subTotal){const sp=document.createElement('span');sp.className='sub-prog board-date';sp.textContent=subDone+'/'+subTotal;meta.appendChild(sp);}
      const dksp=document.createElement('span');dksp.className='board-date';dksp.textContent=t.dateKey?t.dateKey.slice(5).replace('-','/'):'';meta.appendChild(dksp);
      card.appendChild(tt2);card.appendChild(meta);
      card.onclick=()=>{const d=new Date(t.dateKey);selDate=d;expandedId=t.id;urlFormId=null;switchView('list');};
      col.appendChild(card);
    });
    container.appendChild(col);
  });
}

function renderCal(){
  document.getElementById('month-label').textContent=calYear+'년 '+MONTHS[calMonth];
  const con=document.getElementById('cal-container');con.innerHTML='';
  const grid=document.createElement('div');grid.className='cal-grid';
  DAYS.forEach(d=>{const h=document.createElement('div');h.className='cal-head';h.textContent=d;grid.appendChild(h);});
  const first=new Date(calYear,calMonth,1),last=new Date(calYear,calMonth+1,0),sd=first.getDay(),tk=todayDk(),sk=dk(selDate);
  function bc(date,other){
    const k=dk(date);ensureDay(k);
    const cell=document.createElement('div');cell.className='cal-cell'+(other?' other-m':'')+(k===tk?' is-today':'')+(k===sk?' sel-day':'');
    const dn=document.createElement('div');dn.className='cal-dn';dn.textContent=date.getDate();cell.appendChild(dn);
    const all=[...(tasks[k].urgent||[]).map(t=>({...t,cat:'u'})),...(tasks[k].later||[]).map(t=>({...t,cat:'l'}))];
    all.slice(0,3).forEach(t=>{const p=document.createElement('div');p.className='cal-pill '+t.cat+(t.done?' done':'');p.textContent=t.text;cell.appendChild(p);});
    if(all.length>3){const m=document.createElement('div');m.className='cal-more';m.textContent='+'+(all.length-3)+'개 더';cell.appendChild(m);}
    cell.onclick=()=>{selDate=new Date(date);expandedId=null;tagFilter=null;switchView('list');};
    return cell;
  }
  for(let i=0;i<sd;i++)grid.appendChild(bc(new Date(calYear,calMonth,1-sd+i),true));
  for(let d=1;d<=last.getDate();d++)grid.appendChild(bc(new Date(calYear,calMonth,d),false));
  const rem=(7-((sd+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++)grid.appendChild(bc(new Date(calYear,calMonth+1,i),true));
  con.appendChild(grid);
}

document.addEventListener('click',e=>{if(!e.target.closest('.tag-add-wrap')&&!e.target.closest('.tag-dd'))closeDD();});
load();render();
