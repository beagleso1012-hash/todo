<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 체크리스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-p:#ffffff;--bg-s:#f5f5f4;--bg-t:#efefed;
  --tx-p:#1a1a18;--tx-s:#6b6b68;--tx-t:#a0a09d;
  --bd-l:rgba(0,0,0,0.1);--bd-m:rgba(0,0,0,0.18);--bd-h:rgba(0,0,0,0.28);
  --acc:#185FA5;--acc-d:#0C447C;--r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg-p:#1e1e1c;--bg-s:#2a2a28;--bg-t:#323230;
    --tx-p:#f0f0ee;--tx-s:#a0a09d;--tx-t:#6b6b68;
    --bd-l:rgba(255,255,255,0.08);--bd-m:rgba(255,255,255,0.14);--bd-h:rgba(255,255,255,0.24);
    --acc:#378ADD;--acc-d:#85B7EB;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--tx-p);background:var(--bg-t);min-height:100vh;font-size:14px}
.app{max-width:960px;margin:0 auto;padding:1.25rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding:1rem 1.25rem;background:var(--bg-p);border-radius:var(--rl);border:0.5px solid var(--bd-l)}
.header h1{font-size:17px;font-weight:600}
.tabs{display:flex;gap:3px;background:var(--bg-s);border-radius:var(--r);padding:3px}
.tab{padding:5px 14px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:var(--tx-s);font-family:inherit;transition:all .15s}
.tab.active{background:var(--bg-p);color:var(--tx-p);font-weight:500;border:0.5px solid var(--bd-l)}
.card{background:var(--bg-p);border-radius:var(--rl);border:0.5px solid var(--bd-l);padding:1.25rem}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.nav-btn{background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:4px 10px;cursor:pointer;font-size:14px;color:var(--tx-p);font-family:inherit}
.nav-title{font-size:15px;font-weight:500;min-width:160px;text-align:center}
.today-btn{font-size:12px;padding:3px 9px;margin-left:auto;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);cursor:pointer;color:var(--tx-s);font-family:inherit}
.tag-filter-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:.9rem;min-height:24px}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid var(--bd-l);background:transparent;color:var(--tx-s);font-family:inherit;transition:all .15s}
.filter-chip.active{color:white;border-color:transparent}
.chip-dot{width:6px;height:6px;border-radius:50%}
.section{margin-bottom:1.1rem}
.section-hdr{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sdot{width:7px;height:7px;border-radius:50%}
.sdot-u{background:#E24B4A}.sdot-l{background:#888780}
.stitle{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--tx-s)}
.scnt{font-size:11px;color:var(--tx-t)}
.section-div{height:0.5px;background:var(--bd-l);margin:1.1rem 0}
.drop-zone{min-height:48px;border-radius:var(--r);border:1.5px dashed transparent;transition:all .15s;padding:2px}
.drop-zone.drag-over{border-color:var(--bd-m);background:var(--bg-s)}
.drop-zone.empty{border-color:var(--bd-l)}
.task-item{background:var(--bg-p);border:0.5px solid var(--bd-l);border-radius:var(--r);margin-bottom:5px;overflow:hidden;transition:border-color .15s,opacity .15s}
.task-item:hover{border-color:var(--bd-m)}
.task-item.expanded{border-color:var(--bd-h)}
.task-item.dragging{opacity:.35}
.task-item.drag-ph{border:1.5px dashed var(--bd-m);background:var(--bg-s);height:40px;pointer-events:none}
.task-main{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none}
.dh{cursor:grab;color:var(--tx-t);font-size:13px;flex-shrink:0}
.dh:active{cursor:grabbing}
.task-cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--bd-m);cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;background:transparent;position:relative;transition:all .15s}
.task-cb:checked{background:var(--acc);border-color:var(--acc)}
.task-cb:checked::after{content:'';position:absolute;left:2px;top:1px;width:4px;height:6px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg)}
.twrap{flex:1;min-width:0}
.ttitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttitle.done{text-decoration:line-through;color:var(--tx-t)}
.tmeta{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.itag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:500;color:white;flex-shrink:0}
.av-xs{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:500;color:white;flex-shrink:0}
.memo-prev{font-size:10px;color:var(--tx-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.tact{display:flex;align-items:center;gap:5px;flex-shrink:0}
.exp-icon{font-size:9px;color:var(--tx-t);transition:transform .2s}
.exp-icon.open{transform:rotate(180deg)}
.tdel{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:15px;padding:0 1px;line-height:1;font-family:inherit}
.tdel:hover{color:var(--tx-p)}
.task-detail{display:none;padding:0 12px 12px;border-top:0.5px solid var(--bd-l)}
.task-detail.open{display:block}
.dlabel{font-size:11px;font-weight:500;color:var(--tx-s);margin:9px 0 5px;letter-spacing:.04em}
.assignee-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.av-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:white;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:border-color .15s}
.av-sm.selected{border-color:var(--tx-p)}
.tag-editor{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500;color:white}
.tbadge-rm{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.8);font-size:12px;line-height:1;padding:0;font-family:inherit}
.tag-add-wrap{position:relative}
.tag-add-btn{padding:2px 9px;border-radius:20px;font-size:11px;border:0.5px dashed var(--bd-m);background:transparent;color:var(--tx-s);cursor:pointer;font-family:inherit}
.tag-dd{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg-p);border:0.5px solid var(--bd-m);border-radius:var(--r);padding:6px;z-index:200;min-width:160px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tag-dd-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12px}
.tag-dd-item:hover{background:var(--bg-s)}
.tdd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tag-new-inp{width:100%;padding:4px 7px;border:0.5px solid var(--bd-l);border-radius:5px;font-size:12px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);outline:none;margin-top:4px}
.color-row{display:flex;gap:4px;margin-top:4px;padding:0 2px}
.cswatch{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.cswatch:hover{transform:scale(1.2)}
.cswatch.sel{border-color:var(--tx-p)}
.memo-ta{width:100%;min-height:64px;padding:7px 9px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);resize:vertical;outline:none;line-height:1.55}
.memo-ta:focus{border-color:var(--bd-h);background:var(--bg-p)}
.url-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.url-row{display:flex;align-items:center;gap:6px;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:5px 9px}
.url-link{font-size:12px;color:var(--acc);text-decoration:none;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.url-link:hover{text-decoration:underline}
.url-label{font-size:11px;color:var(--tx-s);flex-shrink:0;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url-sep{font-size:11px;color:var(--tx-t);flex-shrink:0}
.url-del{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:14px;line-height:1;padding:0;font-family:inherit;flex-shrink:0}
.url-del:hover{color:var(--tx-p)}
.url-add-form{display:none;flex-direction:column;gap:5px;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:8px 10px}
.url-add-form.open{display:flex}
.url-inp{padding:5px 8px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:12px;font-family:inherit;background:var(--bg-p);color:var(--tx-p);outline:none}
.url-inp:focus{border-color:var(--bd-h)}
.url-form-row{display:flex;gap:5px}
.url-save-btn{padding:4px 11px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500}
.url-save-btn:hover{background:var(--acc-d)}
.url-cancel-btn{padding:4px 9px;background:transparent;color:var(--tx-s);border:0.5px solid var(--bd-l);border-radius:var(--r);cursor:pointer;font-size:11px;font-family:inherit}
.url-add-trigger{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r);font-size:11px;border:0.5px dashed var(--bd-m);background:transparent;color:var(--tx-s);cursor:pointer;font-family:inherit}
.save-row{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;align-items:center}
.save-btn{padding:4px 13px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500}
.save-btn:hover{background:var(--acc-d)}
.saved-badge{font-size:11px;color:#1D9E75;opacity:0;transition:opacity .3s}
.saved-badge.show{opacity:1}
.add-row{display:flex;gap:6px;margin-top:4px}
.add-inp{flex:1;padding:7px 11px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:13px;background:var(--bg-s);color:var(--tx-p);font-family:inherit;outline:none}
.add-inp:focus{border-color:var(--bd-h)}
.add-btn{padding:7px 13px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.add-btn:hover{background:var(--acc-d)}
.empty-sec{font-size:12px;color:var(--tx-t);padding:10px 4px 6px}
.board-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.board-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.board-col{min-width:220px;max-width:240px;flex-shrink:0;background:var(--bg-s);border-radius:var(--rl);padding:10px}
.board-col-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.board-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:white;flex-shrink:0}
.board-name{font-size:13px;font-weight:500}
.board-cnt{font-size:11px;color:var(--tx-t);margin-left:auto}
.board-card{background:var(--bg-p);border:0.5px solid var(--bd-l);border-radius:var(--r);padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.board-card:hover{border-color:var(--bd-m)}
.board-card-title{font-size:13px;margin-bottom:5px;line-height:1.35}
.board-card-title.done{text-decoration:line-through;color:var(--tx-t)}
.board-card-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.board-date{font-size:10px;color:var(--tx-t)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg-p);border:0.5px solid var(--bd-m);border-radius:var(--rl);padding:1.5rem;width:320px;max-width:90vw}
.modal-box h3{font-size:15px;font-weight:500;margin-bottom:1rem}
.member-list{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;max-height:220px;overflow-y:auto}
.member-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);background:var(--bg-s)}
.member-name-inp{flex:1;border:none;background:transparent;font-size:13px;font-family:inherit;color:var(--tx-p);outline:none}
.member-del-btn{background:none;border:none;cursor:pointer;color:var(--tx-t);font-size:15px;line-height:1;font-family:inherit}
.member-del-btn:hover{color:var(--tx-p)}
.member-add-row{display:flex;gap:6px}
.member-inp{flex:1;padding:6px 10px;border:0.5px solid var(--bd-l);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--bg-s);color:var(--tx-p);outline:none}
.member-inp:focus{border-color:var(--bd-h)}
.member-add-btn{padding:6px 12px;background:var(--acc);color:white;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit}
.modal-footer{margin-top:12px;display:flex;justify-content:flex-end}
.modal-close-btn{padding:5px 14px;background:var(--bg-s);border:0.5px solid var(--bd-l);border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;color:var(--tx-p)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd-l);border:0.5px solid var(--bd-l);border-radius:var(--rl);overflow:hidden}
.cal-head{background:var(--bg-s);padding:7px;text-align:center;font-size:12px;font-weight:500;color:var(--tx-s)}
.cal-cell{background:var(--bg-p);min-height:82px;padding:5px;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:var(--bg-s)}
.cal-cell.other-m{background:var(--bg-s)}
.cal-cell.other-m .cal-dn{color:var(--tx-t)}
.cal-cell.is-today .cal-dn{background:var(--acc);color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-cell.sel-day{outline:2px solid var(--acc);outline-offset:-2px}
.cal-dn{font-size:11px;font-weight:500;margin-bottom:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-pill{font-size:10px;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-pill.u{background:#FCEBEB;color:#A32D2D}
.cal-pill.l{background:#F1EFE8;color:#5F5E5A}
.cal-pill.done{background:var(--bg-s);color:var(--tx-t);text-decoration:line-through}
.cal-more{font-size:10px;color:var(--acc);font-weight:500;margin-top:1px}
</style>
</head>
<body>
<div class="app" id="main-app">
  <div class="header">
    <h1>업무 체크리스트</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchView('list')">일별 리스트</button>
      <button class="tab" onclick="switchView('calendar')">월별 달력</button>
      <button class="tab" onclick="switchView('board')">담당자 보드</button>
    </div>
  </div>
  <div class="card" id="list-view">
    <div class="nav">
      <button class="nav-btn" onclick="changeDate(-1)">◀</button>
      <div class="nav-title" id="date-label"></div>
      <button class="nav-btn" onclick="changeDate(1)">▶</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
    <div class="tag-filter-bar" id="tag-filter-bar"></div>
    <div id="list-container"></div>
  </div>
  <div class="card" id="calendar-view" style="display:none">
    <div class="nav">
      <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
      <div class="nav-title" id="month-label"></div>
      <button class="nav-btn" onclick="changeMonth(1)">▶</button>
      <button class="today-btn" onclick="goTodayCal()">오늘</button>
    </div>
    <div id="cal-container"></div>
  </div>
  <div class="card" id="board-view" style="display:none">
    <div class="board-toolbar">
      <span style="font-size:13px;color:var(--tx-s)">전체 업무 기준</span>
      <button class="today-btn" style="margin-left:auto" onclick="openMemberModal()">담당자 관리</button>
    </div>
    <div class="board-scroll" id="board-container"></div>
  </div>
</div>
<div class="modal-overlay" id="member-modal">
  <div class="modal-box">
    <h3>담당자 관리</h3>
    <div class="member-list" id="member-list"></div>
    <div class="member-add-row">
      <input class="member-inp" id="member-inp" placeholder="이름 입력..." onkeydown="if(event.key==='Enter')addMember()">
      <button class="member-add-btn" onclick="addMember()">추가</button>
    </div>
    <div class="modal-footer"><button class="modal-close-btn" onclick="closeMemberModal()">닫기</button></div>
  </div>
</div>
<script>
const DAYS=['일','월','화','수','목','금','토'];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const TAG_COLORS=['#185FA5','#1D9E75','#E24B4A','#BA7517','#7F77DD','#D4537E','#639922','#0F6E56'];
const AV_COLORS=['#185FA5','#1D9E75','#7F77DD','#D4537E','#BA7517','#E24B4A','#0F6E56','#639922'];
let tasks={},globalTags={},members={};
let selectedDate=new Date(),currentMonth=new Date().getMonth(),currentYear=new Date().getFullYear();
let expandedId=null,activeTagFilter=null,openDDId=null,newTagColor=TAG_COLORS[0],urlFormOpenId=null;
let dragSrc=null,dragEl=null,placeholder=null;
function uid(){return Math.random().toString(36).slice(2,9)}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function memberColor(mid){const k=Object.keys(members);return AV_COLORS[k.indexOf(mid)%AV_COLORS.length]}
function ensureDay(k){if(!tasks[k])tasks[k]={urgent:[],later:[]};if(!tasks[k].urgent)tasks[k].urgent=[];if(!tasks[k].later)tasks[k].later=[];}
function allTasks(){const a=[];Object.entries(tasks).forEach(([k,day])=>{[...(day.urgent||[]),...(day.later||[])].forEach(t=>a.push({...t,dateKey:k}));});return a;}
function loadData(){try{const s=localStorage.getItem('wc_v6');if(s){const d=JSON.parse(s);tasks=d.tasks||{};globalTags=d.tags||{};members=d.members||{};}}catch(e){tasks={};globalTags={};members={};}migrate();seedDefaults();}
function migrate(){Object.keys(tasks).forEach(k=>{if(Array.isArray(tasks[k]))tasks[k]={urgent:tasks[k],later:[]};[...(tasks[k].urgent||[]),...(tasks[k].later||[])].forEach(t=>{if(!t.tags)t.tags=[];if(!t.urls)t.urls=[];if(!t.assignees)t.assignees=[];});});}
function seedDefaults(){
  if(!Object.keys(globalTags).length)globalTags={'tag-dev':{name:'개발',color:'#185FA5'},'tag-mtg':{name:'미팅',color:'#7F77DD'},'tag-doc':{name:'문서',color:'#1D9E75'},'tag-mkt':{name:'마케팅',color:'#D4537E'}};
  if(!Object.keys(members).length)members={'m1':{name:'김철수'},'m2':{name:'이영희'},'m3':{name:'박지수'}};
  const t=new Date();

function renderTagFilterBar(){const bar=document.getElementById('tag-filter-bar');bar.innerHTML='';const used=getUsedTags();if(!used.length)return;const all=document.createElement('button');all.className='filter-chip'+(activeTagFilter===null?' active':'');all.textContent='전체';if(activeTagFilter===null)all.style.background='var(--acc)';all.onclick=()=>{activeTagFilter=null;renderList();};bar.appendChild(all);used.forEach(tid=>{const tag=globalTags[tid];if(!tag)return;const chip=document.createElement('button');chip.className='filter-chip'+(activeTagFilter===tid?' active':'');if(activeTagFilter===tid)chip.style.background=tag.color;chip.innerHTML='<span class="chip-dot" style="background:'+tag.color+'"></span>'+tag.name;chip.onclick=()=>{activeTagFilter=activeTagFilter===tid?null:tid;renderList();};bar.appendChild(chip);});}

t v=inp.value.trim();if(!v)return;tasks[k][cat].push({id:uid(),text:v,done:false,memo:'',tags:[],assignees:[],urls:[]});inp.value='';save();renderList();};btn.onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add();};ar.appendChild(inp);ar.appendChild(btn);sec.appendChild(ar);}container.appendChild(sec);if(si===0){const dv=document.createElement('div');dv.className='section-div';container.appendChild(dv);}});}

function renderBoard(){const container=document.getElementById('board-container');container.innerHTML='';const all=allTasks();const cols={};Object.keys(members).forEach(mid=>cols[mid]=[]);cols['__none__']=[];all.forEach(t=>{if(!(t.assignees||[]).length)cols['__none__'].push(t);else(t.assignees||[]).forEach(mid=>{if(cols[mid])cols[mid].push(t);});});[...Object.keys(members),'__none__'].forEach(mid=>{const items=cols[mid];const col=document.createElement('div');col.className='board-col';const hdr=document.createElement('div');hdr.className='board-col-hdr';if(mid!=='__none__'){const av=document.createElement('div');av.className='board-av';av.style.background=memberColor(mid);av.textContent=initials(members[mid].name);const nm=document.createElement('div');nm.className='board-name';nm.textContent=members[mid].name;const cnt=document.createElement('div');cnt.className='board-cnt';cnt.textContent=items.length+'개';hdr.appendChild(av);hdr.appendChild(nm);hdr.appendChild(cnt);}else{const nm=document.createElement('div');nm.className='board-name';nm.style.color='var(--tx-t)';nm.textContent='미할당';const cnt=document.createElement('div');cnt.className='board-cnt';cnt.textContent=items.length+'개';hdr.appendChild(nm);hdr.appendChild(cnt);}col.appendChild(hdr);items.forEach(t=>{const card=document.createElement('div');card.className='board-card';const tt=document.createElement('div');tt.className='board-card-title'+(t.done?' done':'');tt.textContent=t.text;const meta=document.createElement('div');meta.className='board-card-meta';(t.tags||[]).forEach(tid=>{const tag=globalTags[tid];if(!tag)return;const b=document.createElement('span');b.className='itag';b.style.background=tag.color;b.textContent=tag.name;meta.appendChild(b);});const dk=document.createElement('span');dk.className='board-date';dk.textContent=t.dateKey?t.dateKey.slice(5).replace('-','/'):'';meta.appendChild(dk);card.appendChild(tt);card.appendChild(meta);card.onclick=()=>{const d=new Date(t.dateKey);selectedDate=d;expandedId=t.id;urlFormOpenId=null;switchView('list');};col.appendChild(card);});container.appendChild(col);});}
function renderCalendar(){document.getElementById('month-label').textContent=`${currentYear}년 ${MONTHS[currentMonth]}`;const con=document.getElementById('cal-container');con.innerHTML='';const grid=document.createElement('div');grid.className='cal-grid';DAYS.forEach(d=>{const h=document.createElement('div');h.className='cal-head';h.textContent=d;grid.appendChild(h);});const first=new Date(currentYear,currentMonth,1),last=new Date(currentYear,currentMonth+1,0),sd=first.getDay(),tk=todayKey(),sk=dateKey(selectedDate);function bc(date,other){const k=dateKey(date);ensureDay(k);const cell=document.createElement('div');cell.className='cal-cell'+(other?' other-m':'')+(k===tk?' is-today':'')+(k===sk?' sel-day':'');const dn=document.createElement('div');dn.className='cal-dn';dn.textContent=date.getDate();cell.appendChild(dn);const all=[...(tasks[k].urgent||[]).map(t=>({...t,cat:'u'})),...(tasks[k].later||[]).map(t=>({...t,cat:'l'}))];all.slice(0,3).forEach(t=>{const p=document.createElement('div');p.className='cal-pill '+t.cat+(t.done?' done':'');p.textContent=t.text;p.title=t.text;cell.appendChild(p);});if(all.length>3){const m=document.createElement('div');m.className='cal-more';m.textContent='+'+( all.length-3)+'개 더';cell.appendChild(m);}cell.onclick=()=>{selectedDate=new Date(date);expandedId=null;activeTagFilter=null;switchView('list');};return cell;}for(let i=0;i<sd;i++)grid.appendChild(bc(new Date(currentYear,currentMonth,1-sd+i),true));for(let d=1;d<=last.getDate();d++)grid.appendChild(bc(new Date(currentYear,currentMonth,d),false));const rem=(7-((sd+last.getDate())%7))%7;for(let i=1;i<=rem;i++)grid.appendChild(bc(new Date(currentYear,currentMonth+1,i),true));con.appendChild(grid);}
